name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio/ui/package-lock.json

      - name: Verify framework App bundles
        run: |
          go generate ./internal/frameworkapp
          go generate ./internal/studio
          git diff --exit-code -- internal/frameworkapp/bundled/core
          git diff --exit-code -- internal/studio/bundled-app

      - name: Test Go
        run: go test ./...

      - name: Vet Go
        run: go vet ./...

      - name: Test and build Studio
        working-directory: apps/studio/ui
        run: |
          npm ci
          npm test
          npm run build

      - name: Test release scripts and installer
        run: |
          bash -n scripts/*.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          scripts/test-install.sh

      - name: Build and smoke release assets
        run: |
          scripts/build-release.sh v0.0.0-ci dist
          scripts/smoke-release.sh v0.0.0-ci dist

  verify-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: true

      - name: Test PowerShell installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = "v0.0.0-ci"
          $TestRoot = Join-Path $env:RUNNER_TEMP "dygo-installer-test"
          $ReleaseDir = Join-Path $TestRoot "release"
          $InstallDir = Join-Path $TestRoot "install"
          $Asset = "dygo_${Version}_windows_amd64.zip"
          New-Item -ItemType Directory -Path $ReleaseDir -Force | Out-Null

          go build -trimpath -ldflags "-s -w -X github.com/hapyco/dygo/internal/cli.version=$Version" -o (Join-Path $ReleaseDir "dygo.exe") ./cmd/dygo
          Compress-Archive -Path (Join-Path $ReleaseDir "dygo.exe") -DestinationPath (Join-Path $ReleaseDir $Asset)
          Remove-Item (Join-Path $ReleaseDir "dygo.exe")
          $Hash = (Get-FileHash -Algorithm SHA256 (Join-Path $ReleaseDir $Asset)).Hash.ToLowerInvariant()
          "$Hash  $Asset" | Set-Content -Path (Join-Path $ReleaseDir "checksums.txt") -Encoding ascii

          $Listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $Listener.Start()
          $Port = ([System.Net.IPEndPoint]$Listener.LocalEndpoint).Port
          $Listener.Stop()
          $Server = Start-Process python -ArgumentList @("-m", "http.server", "$Port", "--bind", "127.0.0.1", "--directory", $ReleaseDir) -PassThru
          try {
            $env:DYGO_VERSION = $Version
            $env:DYGO_INSTALL_DIR = $InstallDir
            $env:DYGO_DOWNLOAD_BASE_URL = "http://127.0.0.1:$Port"
            for ($Attempt = 0; $Attempt -lt 20; $Attempt++) {
              try {
                Invoke-WebRequest -Uri "$env:DYGO_DOWNLOAD_BASE_URL/checksums.txt" -OutFile (Join-Path $TestRoot "probe.txt")
                break
              }
              catch {
                if ($Attempt -eq 19) { throw }
                Start-Sleep -Milliseconds 250
              }
            }

            & ./scripts/install.ps1
            if ((& (Join-Path $InstallDir "dygo.exe") version) -ne "dygo $Version") {
              throw "installed Windows binary version is incorrect"
            }

            Add-Content -Path (Join-Path $ReleaseDir $Asset) -Value "corrupt" -NoNewline
            $Rejected = $false
            try {
              $env:DYGO_INSTALL_DIR = Join-Path $TestRoot "corrupt-install"
              & ./scripts/install.ps1
            }
            catch {
              $Rejected = $true
            }
            if (-not $Rejected) {
              throw "PowerShell installer accepted a corrupted archive"
            }
          }
          finally {
            Remove-Item Env:DYGO_VERSION -ErrorAction SilentlyContinue
            Remove-Item Env:DYGO_INSTALL_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:DYGO_DOWNLOAD_BASE_URL -ErrorAction SilentlyContinue
            Stop-Process -Id $Server.Id -Force -ErrorAction SilentlyContinue
          }
