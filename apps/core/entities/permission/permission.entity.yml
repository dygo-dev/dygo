label: Permission
description: Role access rule for exactly one Entity or Page target.
icon: key-round
name:
  strategy: random
fields:
  - name: entity
    label: Entity
    type: link
    index: true
    options:
      entity: entity

  - name: page
    label: Page
    type: link
    index: true
    options:
      entity: page

  - name: role
    label: Role
    type: link
    required: true
    index: true
    options:
      entity: role

  - name: read
    label: Read
    type: boolean
    default: false

  - name: create
    label: Create
    type: boolean
    default: false

  - name: update
    label: Update
    type: boolean
    default: false

  - name: delete
    label: Delete
    type: boolean
    default: false

  - name: export
    label: Export
    type: boolean
    default: false

  - name: print
    label: Print
    type: boolean
    default: false

  - name: retired
    label: Retired
    type: boolean
    default: false
    index: true

constraints:
  - type: unique
    fields: [entity, role]

  - type: unique
    fields: [page, role]

  - name: entity-or-page-target
    type: exactly-one
    fields: [entity, page]
